<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
        <title>Calculator-by Utibe</title>
    </head>

    <body>
        <div class="calculator">
            <section >
                <input type="text" placeholder="0" id="input-bar">
            </section>

            <div class="button-row">
                <button class="operator" style="font-size: 1.2rem;">DEL</button>
                <button class="operator" style="font-size: 1.2rem;">AC</button>
                <button class="operator" style="font-size: 1.2rem;">%</button>
                <button class="operator" style="font-size: 1.2rem;">/</button>
            </div>

            <div class="button-row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">*</button>
            </div>

            <div class="button-row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">-</button>
            </div>
            
            <div class="button-row">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">+</button>
            </div>

            <div class="button-row">
                <button>00</button>
                <button>0</button>
                <button>.</button>
                <button class="operator" style="background-color: rgb(139, 16, 16); color: white;">=</button>
            </div>
        </div>
    </body>
</html>
